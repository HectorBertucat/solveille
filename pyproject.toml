[project]
name = "solveille"
version = "0.1.0"
description = "Solveille — nowcast communal de la pression sécheresse-argiles (RGA), bâti exposé et valeur à risque."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "py7zr>=0.21",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

# Note (Claude Code) : installer aussi les extensions DuckDB `spatial` et `httpfs`
# (INSTALL spatial; LOAD spatial; INSTALL httpfs; LOAD httpfs;) et l'outil système `tippecanoe`
# pour la génération des PMTiles. Voir docs/architecture.md.

[tool.ruff]
line-length = 100
target-version = "py312"
# Scripts de référence des skills (.claude) et données de test ne sont pas du code projet.
extend-exclude = [".claude", "tests/fixtures", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solveille"]
